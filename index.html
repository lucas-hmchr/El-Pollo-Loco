<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./assets/3_enemies_chicken/chicken_normal/1_walk/1_w.png">
    <script src="./models/world.class.js"></script>
    <script src="./models/drawable-objects.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/levels.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/chick.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./scripts/game.js"></script>
</head>

<body onload="init()">
    <div id="screen" class="screen">
        <canvas id="canvas" width="720" height="480" class="d-none">

        </canvas>

        <div id="startScreen" class="start-screen">

        </div>

        <div id="endScreen" class="end-screen d-none">

        </div>

        <div id="controlButtons" class="control-buttons d-none">
            <div id="walkButtons">
                <button id="walkLeftBtn"><img src="./assets/icons/arrow-left-btn.svg" alt=""></button>
                <button id="walkRightBtn"><img src="./assets/icons/arrow-right-btn.svg" alt=""></button>
            </div>

            <div id="actionButtons">
                <button id="jumpBtn"><img src="./assets/icons/jump.svg" alt=""></button>
                <button id="throwBtn" class="throw-button"><img src="./assets/6_salsa_bottle/salsa_bottle.png" alt=""></button>
            </div>
        </div>

        <button type="button" id="muteBtnInGame" class="menu-button d-none" onclick="changeGameSound(true)"><img id="muteBtnInGameIcon" src="./assets/icons/sound.svg" alt=""></button>

    </div>

    <div id="rotationOverlay" class="rotation-overlay">
        <span>Please rotate your device</span>
        <img src="./assets/icons/rotate.svg" alt="">
    </div>

    <script src="./scripts/template.js"></script>
    <script src="./scripts/utils.js"></script>
    <script src="./script.js"></script>

</body>

</html>
